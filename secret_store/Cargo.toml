[package]
description = "Conflux secret key management library"
homepage = "https://www.confluxnetwork.org"
license = "GPL-3.0"
name = "secret-store"
version = "0.1.0"
edition = "2018"

[dependencies]
cfx-types = { path = "../cfx_types" }
